org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# AGP 9.x : getDefaultProguardFile('proguard-android.txt') n'est plus autorisé
# (le fichier embarque -dontoptimize). flutter_inappwebview_android 1.1.3
# (et d'autres plugins stables) l'appellent encore. Opt-out officiel :
# https://developer.android.com/build/releases/agp-9-0-0-release-notes
android.r8.proguardAndroidTxt.disallowed=false
android.r8.globalOptionsInConsumerRules.disallowed=false
