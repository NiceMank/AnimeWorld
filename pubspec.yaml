name: animeworld
description: "AnimeWorld – client mobile Flutter pour anime-sama (animes, films, OAV et scans)."
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # État & navigation
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.1

  # Réseau (mêmes requêtes que le site : HTML + episodes.js + JSON scans + /api/*)
  dio: ^5.11.0
  cookie_jar: ^4.0.9
  dio_cookie_manager: ^3.5.0
  html: ^0.15.7

  # Stockage local (équivalent du localStorage du site)
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  path_provider: ^2.1.6

  # UI
  cached_network_image: ^4.0.0
  flutter_cache_manager: ^3.4.2
  flutter_inappwebview: ^6.1.5
  photo_view: ^0.15.0
  smooth_page_indicator: ^3.0.0
  shimmer: ^4.0.0
  url_launcher: ^6.3.2
  wakelock_plus: ^1.8.0
  intl: ^0.20.3
  cupertino_icons: ^1.0.8

  # Notifications temps réel (centre de notifications + notifications système)
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#050914"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
